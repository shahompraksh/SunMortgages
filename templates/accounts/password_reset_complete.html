{% extends "base.html" %}

{% block title %}Password Changed | SunMortgages{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card card-sun shadow-sm text-center">
            <div class="card-body p-4 p-md-5">
                <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-3">
                    <i class="fa-solid fa-circle-check fa-2x"></i>
                </div>
                <h4 class="fw-bold text-navy mb-2" style="color: var(--sun-navy);">Password Changed!</h4>
                <p class="text-muted small mb-4">
                    Your password has been successfully updated. You may now sign in with your new credentials.
                </p>
                <a href="{% url 'login' %}" class="btn btn-sun-primary w-100 py-2">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Log In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
